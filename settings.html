<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuildWithHariOfficialWeb</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#030712;
    color:white;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    height:100vh;
    background:#071122;
    border-right:1px solid rgba(255,255,255,0.05);
    padding:20px;
    position:fixed;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:40px;
}

.logo-box{
    width:45px;
    height:45px;
    border-radius:12px;
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#a855f7;
    font-size:20px;
}

.logo-text h2{
    font-size:30px;
}

.logo-text p{
    color:#94a3b8;
    font-size:12px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.menu a{
    text-decoration:none;
    color:#cbd5e1;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 18px;
    border-radius:18px;
    transition:0.3s;
}

.menu a:hover,
.menu a.active{
    background:#1e293b;
    color:white;
}

/* MAIN */

.main{
    margin-left:280px;
    width:100%;
    padding:35px;
}

.title h1{
    font-size:50px;
}

.title p{
    color:#94a3b8;
    margin-top:10px;
}

/* SETTINGS BOX */

.settings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
    margin-top:40px;
}

.setting-card{
    background:linear-gradient(145deg,#111827,#0b1220);
    border-radius:28px;
    padding:30px;
}

.setting-card h2{
    margin-bottom:20px;
}

.input-box{
    margin-top:18px;
}

.input-box label{
    display:block;
    margin-bottom:10px;
    color:#cbd5e1;
}

.input-box input{
    width:100%;
    height:55px;
    border:none;
    outline:none;
    border-radius:16px;
    padding:0 18px;
    background:#1e293b;
    color:white;
}

.btn{
    margin-top:25px;
    width:100%;
    height:55px;
    border:none;
    border-radius:16px;
    background:#7c3aed;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#6d28d9;
}

.logout{
    background:#dc2626;
}

.logout:hover{
    background:#b91c1c;
}

/* MOBILE */

@media(max-width:900px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

}
.menu-btn{
    display:none;
    position:fixed;
    top:15px;
    left:15px;
    font-size:26px;
    color:white;
    background:#1e293b;
    padding:10px 14px;
    border-radius:10px;
    z-index:1001;
    cursor:pointer;
}

.mobile-sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:240px;
    height:100%;
    background:#071122;
    padding-top:70px;
    transition:0.3s;
    z-index:1000;
}

.mobile-sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:18px 25px;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.mobile-sidebar a:hover{
    background:#1e293b;
}

.mobile-sidebar.show{
    left:0;
}

@media(max-width:768px){

    body{
        display:block;
    }

    .sidebar{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .main{
        margin-left:0;
        width:100%;
        padding:70px 15px 20px;
    }

    .title h1{
        font-size:34px;
    }

    .settings-grid{
        grid-template-columns:1fr;
        gap:20px;
    }

    .setting-card{
        padding:20px;
    }

}
</style>
</head>
<body>
	<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<div class="mobile-sidebar" id="sidebar">
    <a href="profile.html">My Profile</a>
    <a href="videos.html">Videos</a>
    <a href="courses.html">Courses</a>
    <a href="project.html">Project</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="settings.html">Settings</a>
</div>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <div class="logo-box">
            <i class="fa-solid fa-b"></i>
        </div>

        <div class="logo-text">
            <h2>BuildWithHari</h2>
            <p>DEVELOPER</p>
        </div>

    </div>

    <div class="menu">

        <a href="profile.html">
            <i class="fa-regular fa-user"></i>
            My Profile
        </a>
		
        <a href="videos.html">
   	   <i class="fa-solid fa-video"></i>
    	   Videos
	</a>
		
        <a href="courses.html">
            <i class="fa-solid fa-book-open"></i>
            Courses
        </a>

        <a href="project.html">
            <i class="fa-solid fa-project-diagram"></i>
            Project
        </a

		<a href="games.html" class="active">
            <i class="fa-solid fa-gamepad"></i>
            Games
        </a>

        <a href="leaderboard.html">
            <i class="fa-solid fa-trophy"></i>
            Leaderboard
        </a>

        <a href="settings.html" class="active">
            <i class="fa-solid fa-gear"></i>
            Settings
        </a>

    </div>

</div>

<!-- MAIN -->

<div class="main">

    <div class="title">

        <h1>Settings</h1>

        <p>
            Manage your account settings
        </p>

    </div>

    <div class="settings-grid">

        <!-- PROFILE SETTINGS -->

        <div class="setting-card">

            <h2>
                <i class="fa-regular fa-user"></i>
                Profile Settings
            </h2>

            <div class="input-box">

                <label>Full Name</label>

               <input type="text"
				id="userName"
			    value="userName">

            </div>

            <div class="input-box">

                <label>Email</label>

               <input type="email"
   				id="userEmail"
			value="userEmail">

            </div>

            <button class="btn"
		onclick="saveProfile()">
    		Save Changes
		</button>

        </div>

        <!-- PASSWORD SETTINGS -->

        <div class="setting-card">

            <h2>
                <i class="fa-solid fa-lock"></i>
                Password
            </h2>

            <div class="input-box">

                <label>Current Password</label>

                <input type="password"
		id="currentPassword"
		placeholder="Enter current password">

            </div>

            <div class="input-box">

                <label>New Password</label>

                <input type="password"
		id="newPassword"
		placeholder="Enter new password">

            </div>

           <button class="btn"
	onclick="updatePassword()">
    		Update Password
</button>

        </div>

        <!-- LOGOUT -->

        <div class="setting-card">

            <h2>
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </h2>

            <p style="color:#94a3b8;margin-top:10px;">
                Logout from your account safely
            </p>

            <button class="btn logout"
            onclick="logout()">

                Logout

            </button>

        </div>

    </div>

</div>

<script>

/* LOAD USER DATA */

let oldName =
localStorage.getItem("profileName") || "";

let oldEmail =
localStorage.getItem("profileEmail") || "";

/* SHOW DATA IN INPUT */

document.getElementById("userName").value =
oldName;

document.getElementById("userEmail").value =
oldEmail;

/* SAVE PROFILE */

function saveProfile(){

    let name =
    document.getElementById(
    "userName"
    ).value.trim();

    let email =
    document.getElementById(
    "userEmail"
    ).value.trim();

    /* EMPTY na OLD VALUE */

    if(name === ""){

        name = oldName;

    }

    if(email === ""){

        email = oldEmail;

    }

    /* SAVE LOCAL STORAGE */

    localStorage.setItem(
    "profileName",
    name
    );

    localStorage.setItem(
    "profileEmail",
    email
    );

    alert("Profile Updated ✅");

    window.location.href =
    "profile.html";

}

/* PASSWORD UPDATE */

function updatePassword(){

    let currentPassword =
    document.getElementById(
    "currentPassword"
    ).value;

    let newPassword =
    document.getElementById(
    "newPassword"
    ).value;

    let savedPassword =
    localStorage.getItem(
    "userPassword"
    );

    /* FIRST PASSWORD */

    if(savedPassword == null){

        if(newPassword === ""){

            alert(
            "Enter New Password ❌"
            );

            return;

        }

        localStorage.setItem(
        "userPassword",
        newPassword
        );

        alert(
        "Password Created ✅"
        );

        return;

    }

    /* CHECK CURRENT PASSWORD */

    if(currentPassword != savedPassword){

        alert(
        "Current Password Wrong ❌"
        );

        return;

    }

    /* EMPTY CHECK */

    if(newPassword === ""){

        alert(
        "Enter New Password ❌"
        );

        return;

    }

    /* SAVE NEW PASSWORD */

    localStorage.setItem(
    "userPassword",
    newPassword
    );

    alert(
    "Password Updated ✅"
    );

}

/* LOGOUT */

function logout(){

    localStorage.removeItem(
    "accountCreated"
    );

    alert("Logout Success ✅");

    window.location.href =
    "index.html";

}

/* MOBILE SIDEBAR */

function toggleSidebar(){

    document.getElementById(
    "sidebar"
    ).classList.toggle("show");

}

</script>

</body>
</html>
