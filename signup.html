<!DOCTYPE html>
<html>
<head>

<title>Signup</title>

<style>
    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    overflow:hidden;
    position:relative;
}

/* Glow Background */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#7c3aed;
    border-radius:50%;
    top:-150px;
    left:-150px;
    filter:blur(120px);
    opacity:0.5;
}

body::after{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#2563eb;
    border-radius:50%;
    bottom:-150px;
    right:-150px;
    filter:blur(120px);
    opacity:0.5;
}

/* Container */

.container{
    width:420px;
    position:relative;
    z-index:10;
}

/* Form Box */

.form-box{
    width:100%;
    padding:40px 30px;
    border-radius:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    color:white;
    display:none;
}

.form-box.active{
    display:block;
}

.form-box h1{
    text-align:center;
    margin-bottom:10px;
    font-size:38px;
}

.form-box p{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

/* Inputs */

.input-box{
    width:100%;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    height:58px;
    border:none;
    outline:none;
    border-radius:16px;
    padding:0 18px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    color:white;
    font-size:15px;
}

.input-box input::placeholder{
    color:#cbd5e1;
}

/* Button */

.btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:16px;
    background:linear-gradient(to right,#7c3aed,#2563eb);
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.03);
}

/* Switch */

.switch{
    text-align:center;
    margin-top:22px;
    color:#cbd5e1;
}

.switch span{
    color:#c4b5fd;
    cursor:pointer;
    font-weight:600;
}

/* Mobile */

@media(max-width:500px){

    .container{
        width:92%;
    }

    .form-box{
        padding:35px 22px;
    }

    .form-box h1{
        font-size:30px;
    }

}


body{
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.box{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    text-align:center;
}

a{
    color:#38bdf8;
    text-decoration:none;
}

</style>

</head>
<body>

    <div class="form-box" id="signupForm">

        <h1>Create Account</h1>

        <p>Signup to continue</p>

        <div class="input-box">
            <input type="text" placeholder="Full Name">
        </div>

        <div class="input-box">
            <input type="email" placeholder="Enter Email">
        </div>

        <div class="input-box">
            <input type="password" placeholder="Create Password">
        </div>

        <button class="btn">Sign Up</button>

        <div class="switch">
            Already have an account?
            <span onclick="showLogin()">Login</span>
        </div>

    </div>

</body>
</html>s
