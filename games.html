<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Games</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#030712;
    color:white;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    height:100vh;
    background:#071122;
    border-right:1px solid rgba(255,255,255,0.05);
    padding:20px;
    position:fixed;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:40px;
}

.logo-box{
    width:45px;
    height:45px;
    border-radius:12px;
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#a855f7;
    font-size:20px;
}

.logo-text h2{
    font-size:30px;
}

.logo-text p{
    color:#94a3b8;
    font-size:12px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.menu a{
    text-decoration:none;
    color:#cbd5e1;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 18px;
    border-radius:18px;
    transition:.3s;
}

.menu a:hover,
.menu a.active{
    background:#1e293b;
    color:white;
}

/* MAIN */

.main{
    margin-left:280px;
    width:100%;
    padding:35px;
}

.title h1{
    font-size:50px;
}

.title p{
    color:#94a3b8;
    margin-top:10px;
}

.game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
    margin-top:40px;
}

.game-card{
    background:linear-gradient(145deg,#111827,#0b1220);
    border-radius:25px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.05);
}

.game-image{
    height:180px;
    background:linear-gradient(to right,#7c3aed,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
}

.game-content{
    padding:25px;
}

.game-content h2{
    margin-bottom:10px;
}

.game-content p{
    color:#94a3b8;
    margin-bottom:20px;
}

.btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:12px;
    background:#7c3aed;
    color:white;
    cursor:pointer;
}

.btn:hover{
    background:#6d28d9;
}

/* MOBILE MENU */

.menu-btn{
    display:none;
    position:fixed;
    top:15px;
    left:15px;
    background:#1e293b;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    font-size:22px;
    z-index:1001;
    cursor:pointer;
}

.mobile-sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:240px;
    height:100%;
    background:#071122;
    padding-top:70px;
    transition:.3s;
    z-index:1000;
}

.mobile-sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:18px 25px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.mobile-sidebar.show{
    left:0;
}

/* MOBILE */

@media(max-width:768px){

    body{
        display:block;
    }

    .sidebar{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .main{
        margin-left:0;
        padding:70px 15px 20px;
    }

    .title h1{
        font-size:34px;
    }

    .game-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>
<body>

<div class="menu-btn" onclick="toggleSidebar()">☰</div>

<div class="mobile-sidebar" id="sidebar">
    <a href="profile.html">My Profile</a>
    <a href="videos.html">Videos</a>
    <a href="courses.html">Courses</a>
    <a href="project.html">Project</a>
    <a href="games.html">Games</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="settings.html">Settings</a>
</div>

<div class="sidebar">

    <div class="logo">
        <div class="logo-box">
            <i class="fa-solid fa-b"></i>
        </div>

        <div class="logo-text">
            <h2>BuildWithHari</h2>
            <p>DEVELOPER</p>
        </div>
    </div>

    <div class="menu">

        <a href="profile.html">
            <i class="fa-regular fa-user"></i>
            My Profile
        </a>

        <a href="videos.html">
            <i class="fa-solid fa-video"></i>
            Videos
        </a>

        <a href="courses.html">
            <i class="fa-solid fa-book-open"></i>
            Courses
        </a>

        <a href="project.html">
            <i class="fa-solid fa-project-diagram"></i>
            Project
        </a>

        <a href="games.html" class="active">
            <i class="fa-solid fa-gamepad"></i>
            Games
        </a>

        <a href="leaderboard.html">
            <i class="fa-solid fa-trophy"></i>
            Leaderboard
        </a>

        <a href="settings.html">
            <i class="fa-solid fa-gear"></i>
            Settings
        </a>

        <a href="about.html">
            <i class="fa-solid fa-circle-info"></i>
            <span>About</span>
        </a>

    </div>

</div>

<div class="main">

    <div class="title">
        <h1>Games</h1>
        <p>Play and enjoy games</p>
    </div>

    <div class="game-grid">

        <div class="game-card">
            <div class="game-image">
                <i class="fa-solid fa-train"></i>
            </div>

            <div class="game-content">
                <h2>Subway Surfers</h2>
                <p>Run and collect coins.</p>

                <button class="btn"
                onclick="window.location.href='https://subway-surfers.cc/'">
                    Play Now
                </button>
            </div>
        </div>

        <div class="game-card">
            <div class="game-image">
                <i class="fa-solid fa-car"></i>
            </div>

            <div class="game-content">
                <h2>Car Racing</h2>
                <p>Fast racing game.</p>

                <button class="btn"
                onclick="window.location.href='https://playgama.com/game/car-crush-realistic-destruction'">
                    Play Now
                </button>
            </div>
        </div>

        <div class="game-card">
            <div class="game-image">
                <i class="fa-solid fa-xmark"></i>
            </div>

            <div class="game-content">
                <h2>Tic Tac Toe</h2>
                <p>Classic multiplayer game.</p>

                <button class="btn"
                onclick="window.location.href='https://poki.com/en/g/tic-tac-toe-3'">
                    Play Now
                </button>
            </div>
        </div>

    </div>

</div>

<script>

function toggleSidebar(){
    document.getElementById("sidebar")
    .classList.toggle("show");
}

</script>

</body>
</html>
