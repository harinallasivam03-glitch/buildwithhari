<!DOCTYPE html>
<html>
<head>
    <title>HTML PDFs</title>
    <style>
        body{
            margin:0;
            padding:30px;
            background:#020617;
            font-family:Arial,sans-serif;
            color:white;
        }

        h1{
            margin-bottom:30px;
        }

        .pdf-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
            gap:30px;
        }

        .pdf-card{
            background:linear-gradient(135deg,#7c3aed,#2563eb);
            border-radius:20px;
            overflow:hidden;
            cursor:pointer;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }

        .pdf-card iframe{
            width:100%;
            height:320px;
            border:none;
            background:white;
        }

        .pdf-info{
            background:#0f172a;
            padding:20px;
        }

        .pdf-info h3{
            margin:0;
            font-size:28px;
        }

        .pdf-info p{
            color:#94a3b8;
            margin-top:10px;
            font-size:18px;
        }
      
    @media(max-width:768px){

    body{
        padding:15px;
    }

    h1{
        font-size:28px;
        margin-top:20px;
    }

    .pdf-grid{
        grid-template-columns:1fr;
        gap:20px;
    }

    .pdf-card iframe{
        height:280px;
    }

    .pdf-info{
        padding:15px;
    }

    .pdf-info h3{
        font-size:22px;
    }

    .pdf-info p{
        font-size:14px;
    }

}
        .menu-btn{
    display:none;
    position:fixed;
    top:15px;
    left:15px;
    font-size:28px;
    color:white;
    background:#1e293b;
    padding:8px 14px;
    border-radius:10px;
    z-index:1000;
    cursor:pointer;
}

.mobile-sidebar{
    position:fixed;
    top:0;
    left:-250px;
    width:220px;
    height:100%;
    background:#0f172a;
    padding-top:70px;
    transition:0.3s;
    z-index:999;
}

.mobile-sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:18px 25px;
}

.mobile-sidebar.show{
    left:0;
}

@media(max-width:768px){
    .menu-btn{
        display:block;
    }

    .sidebar{
        display:none;
    }
}
</style>
</head>
<body>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>

<div class="mobile-sidebar" id="sidebar">
    <a href="profile.html">My Profile</a>
    <a href="videos.html">Videos</a>
    <a href="courses.html">Courses</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="settings.html">Settings</a>
</div>
    

<h1>HTML Course PDFs</h1>

<div class="pdf-grid">

    <div class="pdf-card" onclick="window.location.href='pdf-view.html'">
        <iframe src="html_tutorial.pdf#toolbar=0"></iframe>
        <div class="pdf-info">
            <h3>HTML Tutorial</h3>
            <p>Learn HTML basics</p>
        </div>
    </div>

    <div class="pdf-card" onclick="window.location.href='pdf-view2.html'">
        <iframe src="html-standard.pdf#toolbar=0"></iframe>
        <div class="pdf-info">
            <h3>HTML Standard</h3>
            <p>Practice examples</p>
        </div>
    </div>

    <div class="pdf-card" onclick="window.location.href='pdf-view3.html'">
        <iframe src="HTML Basics.pdf#toolbar=0"></iframe>
        <div class="pdf-info">
            <h3>HTML Basics</h3>
            <p>Forms tutorial</p>
        </div>
    </div>

      <div class="pdf-card" onclick="window.location.href='pdf-view4.html'">
        <iframe src="Learning-html.pdf#toolbar=0"></iframe>
        <div class="pdf-info">
            <h3>HTML Learning</h3>
            <p>Forms tutorial</p>
        </div>
    </div>

     <div class="pdf-card" onclick="window.location.href='pdf-view5.html'">
        <iframe src="Learning-html.pdf#toolbar=0"></iframe>
        <div class="pdf-info">
            <h3>HTML Learning</h3>
            <p>Forms tutorial</p>
        </div>
    </div>

</div>
    <script>
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("show");
}
</script>

</body>
</html>
