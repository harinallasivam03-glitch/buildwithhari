<!DOCTYPE html>
<html>
<head>
    <title>HTML PDF Notes</title>
    <style>
        body{
            margin:0;
            background:#0b1120;
            font-family:Arial;
            color:white;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        .pdf-card{
            width:350px;
            margin:auto;
            background:#1e293b;
            border-radius:15px;
            padding:15px;
            cursor:pointer;
            box-shadow:0 0 10px rgba(0,0,0,0.4);
        }

        .pdf-card:hover{
            transform:scale(1.03);
            transition:0.3s;
        }

        iframe{
            width:100%;
            height:450px;
            border:none;
            border-radius:10px;
        }

        h3{
            text-align:center;
            margin-top:15px;
        }
    </style>
</head>
<body>

<h1>HTML Course PDF</h1>

<div class="pdf-card" onclick="window.location.href='pdf-view.html'">

    <iframe src="html_tutorial.pdf#toolbar=0&navpanes=0&scrollbar=0"></iframe>

    <h3>HTML Tutorial PDF</h3>

</div>
    
    <div class="pdf-card" onclick="window.location.href='pdf-view2.html'">

    <iframe src="html-standard.pdf#toolbar=0&navpanes=0&scrollbar=0"></iframe>

    <h3>HTML Examples PDF</h3>

</div>

    <div class="pdf-card" onclick="window.location.href='pdf-view3.html'">

    <iframe src="HTML Basics.pdf#toolbar=0&navpanes=0&scrollbar=0"></iframe>

    <h3>HTML Examples PDF</h3>

</div>
    
    <div class="pdf-card" onclick="window.location.href='pdf-view4.html'">

    <iframe src="Learning-html.pdf#toolbar=0&navpanes=0&scrollbar=0"></iframe>

    <h3>HTML Examples PDF</h3>

</div>
    
</body>
</html>
