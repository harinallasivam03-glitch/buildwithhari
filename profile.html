<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuildWithHari Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#030712;
    color:white;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    height:100vh;
    background:#071122;
    border-right:1px solid rgba(255,255,255,0.05);
    padding:20px;
    position:fixed;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:40px;
}

.logo-box{
    width:45px;
    height:45px;
    border-radius:12px;
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#a855f7;
    font-size:20px;
}

.logo-text h2{
    font-size:30px;
}

.logo-text p{
    color:#94a3b8;
    font-size:12px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.menu a{
    text-decoration:none;
    color:#cbd5e1;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 18px;
    border-radius:18px;
    transition:0.3s;
}

.menu a:hover,
.menu a.active{
    background:#1e293b;
    color:white;
}

.main{
    margin-left:280px;
    width:100%;
    padding:35px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.coin-box{
    background:#111827;
    padding:12px 22px;
    border-radius:18px;
    display:flex;
    align-items:center;
    gap:10px;
}

.coin-box span{
    color:#facc15;
    font-weight:600;
}

.profile-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#facc15;
    color:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:700;
}

.title h1{
    font-size:55px;
}

.title p{
    color:#94a3b8;
    margin-top:10px;
}

.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
    margin-top:30px;
}

.profile-card{
    background:linear-gradient(145deg,#111827,#0b1220);
    border-radius:28px;
    padding:28px;
}

.profile-info{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.big-avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    border:2px solid #facc15;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:34px;
    color:#facc15;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.stat-box{
    background:#0f172a;
    padding:25px;
    border-radius:22px;
    text-align:center;
}

.stat-box h1{
    font-size:42px;
    margin-bottom:10px;
}

.progress-card{
    margin-top:25px;
    background:linear-gradient(145deg,#111827,#0b1220);
    border-radius:28px;
    padding:28px;
}

.progress{
    width:100%;
    height:16px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}

.progress-bar{
    width:45%;
    height:100%;
    background:linear-gradient(to right,#7c3aed,#2563eb);
}

.leaderboard{
    background:linear-gradient(145deg,#111827,#0b1220);
    border-radius:28px;
    padding:28px;
}

.rank-box{
    background:#2b2b24;
    border-radius:22px;
    text-align:center;
    padding:35px;
    margin-top:20px;
}

.rank-box h1{
    font-size:80px;
    color:#facc15;
}

.user{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    background:#0f172a;
    border-radius:18px;
    margin-top:14px;
}

.number{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#facc15;
    color:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:700;
}

.mc{
    background:#1f2937;
    padding:8px 14px;
    border-radius:10px;
    color:#facc15;
}

@media(max-width:900px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="sidebar">

    <div class="logo">

        <div class="logo-box">
            <i class="fa-solid fa-b"></i>
        </div>

        <div class="logo-text">
            <h2>BuildWithHari</h2>
            <p>DEVELOPERS</p>
        </div>

    </div>

    <div class="menu">

        <a href="#" class="active">
            <i class="fa-regular fa-user"></i>
            My Profile
        </a>

        <a href="courses.html">
            <i class="fa-solid fa-book-open"></i>
    	    Courses
	</a>

       <a href="leaderboard.html">
  	   <i class="fa-solid fa-trophy"></i>
  	   Leaderboard
	</a>

        <a href="settings.html">
  	   <i class="fa-solid fa-gear"></i>
   	   Settings
	</a>

    </div>

</div>

<div class="main">

    <div class="topbar">

        <div class="coin-box">
            <i class="fa-solid fa-coins"></i>
            <span>10 MC</span>
        </div>

        <div class="profile-top">

            <div>
               <h3 id="topName"></h3>
                <p style="color:#94a3b8;">User</p>
            </div>

            <div class="avatar">
                H
            </div>

        </div>

    </div>

    <div class="title">

        <h1>My Profile</h1>

        <p>
            Track your progress and performance
        </p>

    </div>

    <div class="grid">

        <div>

            <div class="profile-card">

                <div class="profile-info">

                    <div class="big-avatar">
                        H
                    </div>

                    <div>
                        <h2 id="showName"></h2>
                       <p id="showEmail"></p>
                    </div>

                </div>

                <div class="stats">

                    <div class="stat-box">
                        <h1 style="color:#facc15;">10</h1>
                        <p>MC Coins</p>
                    </div>

                    <div class="stat-box">
                        <h1 style="color:#00ff99;">0</h1>
                        <p>Completed</p>
                    </div>

                    <div class="stat-box">
                        <h1 style="color:#f97316;">0</h1>
                        <p>Pending</p>
                    </div>

                </div>

            </div>

            <div class="progress-card">

                <h2>
                    Learning Progress
                </h2>

                <div class="progress">
                    <div class="progress-bar"></div>
                </div>

            </div>

        </div>

        <div class="leaderboard">

            <h2>
                Leaderboard Rank
            </h2>

            <div class="rank-box">

                <h1>#10</h1>

                <p>Your Rank</p>

            </div>

            <div class="user">

                <div style="display:flex;align-items:center;gap:12px;">

                    <div class="number">1</div>

                    <h3 id="showName"></h3>

                </div>

                <div class="mc">
                    35 MC
                </div>

            </div>

            <div class="user">

                <div style="display:flex;align-items:center;gap:12px;">

                    <div class="number"
                    style="background:silver;">
                        2
                    </div>

                    <h3 id="showName"></h3>

                </div>

                <div class="mc">
                    25 MC
                </div>

            </div>

            <div class="user">

                <div style="display:flex;align-items:center;gap:12px;">

                    <div class="number"
                    style="background:#f97316;">
                        3
                    </div>

                    <h3 id="showName"></h3>

                </div>

                <div class="mc">
                    10 MC
                </div>

            </div>

        </div>

    </div>

</div>
<script>

let savedName =
localStorage.getItem("profileName");

let savedEmail =
localStorage.getItem("profileEmail");

if(savedName){

    document.getElementById(
    "showName").innerText = savedName;

    document.getElementById(
    "topName").innerText = savedName;

}

if(savedEmail){

    document.getElementById(
    "showEmail").innerText = savedEmail;

}

</script>

</body>
</html>
