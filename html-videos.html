<!DOCTYPE html>
<html>
<head>
<title>HTML Videos</title>
<style>
body{
    background:#0b1120;
    color:white;
    font-family:sans-serif;
    padding:20px;
}
.video{
    display:flex;
    gap:15px;
    margin:20px 0;
    cursor:pointer;
    background:#1e293b;
    padding:15px;
    border-radius:10px;
}
img{
    width:220px;
    border-radius:10px;
}

@media(max-width:768px){

    body{
        padding:15px;
    }

    h1{
        font-size:28px;
        margin-bottom:20px;
    }

    .video{
        flex-direction:column;
        padding:12px;
        gap:12px;
    }

    img{
        width:100%;
        height:auto;
    }

    h3{
        font-size:18px;
        line-height:28px;
    }

}
    .menu-btn{
    display:none;
    position:fixed;
    top:15px;
    left:15px;
    font-size:28px;
    color:white;
    background:#1e293b;
    padding:8px 14px;
    border-radius:10px;
    z-index:1000;
    cursor:pointer;
}

.mobile-sidebar{
    position:fixed;
    top:0;
    left:-250px;
    width:220px;
    height:100%;
    background:#0f172a;
    padding-top:70px;
    transition:0.3s;
    z-index:999;
}

.mobile-sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:18px 25px;
}

.mobile-sidebar.show{
    left:0;
}

@media(max-width:768px){
    .menu-btn{
        display:block;
    }

    .sidebar{
        display:none;
    }
}
</style>
</head>
<body>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>

<div class="mobile-sidebar" id="sidebar">
    <a href="profile.html">My Profile</a>
    <a href="videos.html">Videos</a>
    <a href="courses.html">Courses</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="settings.html">Settings</a>
</div>

    <img src="https://img.youtube.com/vi/9pS6UkIQxbw/hqdefault.jpg">
    <h3>
What is HTML? Explained in Tamil 🔥 (Beginner Guide) | BuildWithHari |</h3>
  
</div>

<div class="video" onclick="playVideo('aD4Sp44DoKI')">

    <h3>
HTML Lists Explained 🔥 | ul, ol, li Full Tutorial for Beginners | BuildWithHari |</h3>
   
</div>

<script>
function playVideo(id){
    localStorage.setItem("videoLink","https://www.youtube.com/embed/"+id);
    window.location.href="watch.html";
}

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("show");
}
</script>

</body>
</html>
