<!DOCTYPE html>
<html>
<head>
<title>HTML Videos</title>
<style>
body{
    background:#0b1120;
    color:white;
    font-family:sans-serif;
    padding:20px;
    margin:0;
}

.video{
    background:#111827;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:22px;
    cursor:pointer;
}

.video img{
    width:100%;
    display:block;
    border-radius:0;
}

.video h3{
    font-size:16px;
    line-height:24px;
    padding:12px;
    font-weight:500;
    margin:0;
}

.menu-btn{
    display:none;
    position:fixed;
    top:15px;
    left:15px;
    font-size:26px;
    color:white;
    background:#1e293b;
    padding:10px 14px;
    border-radius:10px;
    z-index:1001;
    cursor:pointer;
}

.mobile-sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:240px;
    height:100%;
    background:#071122;
    padding-top:70px;
    transition:0.3s;
    z-index:1000;
}

.mobile-sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:18px 25px;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.mobile-sidebar a:hover{
    background:#1e293b;
}

.mobile-sidebar.show{
    left:0;
}

@media(max-width:768px){

    body{
        padding:70px 12px 15px;
    }

    h1{
        font-size:26px;
    }

    .menu-btn{
        display:block;
    }

}
</style>
</head>
<body>
    <div class="menu-btn" onclick="toggleSidebar()">☰</div>

<div class="mobile-sidebar" id="sidebar">
    <a href="profile.html">My Profile</a>
    <a href="videos.html">Videos</a>
    <a href="courses.html">Courses</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="settings.html">Settings</a>
</div>

</div>

<div class="video" onclick="playVideo('aD4Sp44DoKI')">

<script>
function playVideo(id){
    localStorage.setItem("videoLink","https://www.youtube.com/embed/"+id);
    window.location.href="watch.html";
}

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("show");
}
</script>

</body>
</html>
