<style>

<script>
/* EMAILJS */

emailjs.init("ZLApUHPsYvYFuwOvo");

/* OTP INPUTS */

const inputs = document.querySelectorAll(".otp-inputs input");

/* AUTO MOVE */

inputs.forEach((input,index)=>{

    input.addEventListener("keyup",()=>{

        if(input.value.length === 1){

            if(inputs[index + 1]){

                inputs[index + 1].focus();

            }

        }

    });

});

/* TIMER */

let timer;

function startTimer(){

    clearInterval(timer);

    let time = 30;

    document.getElementById("count").innerText = time;

    document.getElementById("resendBtn").style.display = "none";

    timer = setInterval(()=>{

        time--;

        document.getElementById("count").innerText = time;

        if(time <= 0){

            clearInterval(timer);

            document.getElementById("resendBtn").style.display = "block";

        }

    },1000);

}

/* RESEND */

function resendOTP(){

    sendOTP();

}

/* VERIFY */

function verifyOTP(){

    let enteredOtp = "";

    inputs.forEach(input=>{

        enteredOtp += input.value;

    });

    let realOtp = localStorage.getItem("otp");

    let expireTime = localStorage.getItem("otpExpire");

    if(Date.now() > expireTime){

        alert("OTP Expired");

        return;

    }

if(enteredOtp == realOtp){

    let name = document.getElementById("name").value;s
    let email = document.getElementById("email").value;

    localStorage.setItem("profileName", name);
    localStorage.setItem("profileEmail", email);

    localStorage.setItem("accountCreated","true");

    alert("Login Success ✅");

    window.location.href = "profile.html";

}else{

        alert("Wrong OTP");

    }

}

</script>
