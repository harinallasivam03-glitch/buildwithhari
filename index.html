<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OTP Login</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    color:white;
}

.box{
    width:350px;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

input{
    width:100%;
    height:50px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    padding-left:15px;
    font-size:16px;
}

button{
    width:100%;
    height:50px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#7c3aed;
    color:white;
    font-size:18px;
    cursor:pointer;
}

#otpPage{
    display:none;
}

.otp-inputs{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:20px;
}

.otp-inputs input{
    width:45px;
    height:55px;
    text-align:center;
    font-size:20px;
    padding:0;
}

.timer{
    margin-top:20px;
    color:yellow;
}

</style>
</head>
<body>

<div class="box">

    <!-- LOGIN -->

    <div id="loginPage">

        <h1>OTP Login</h1>

        <input type="email" id="email" placeholder="Enter Gmail">

        <button onclick="sendOTP()">
            Send OTP
        </button>

    </div>

    <!-- OTP -->

    <div id="otpPage">

        <h1>Verify OTP</h1>

        <div class="otp-inputs">

            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">

        </div>

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

        <div class="timer">
            Time Left : <span id="count">30</span>s
        </div>

        <button id="resendBtn"
        style="display:none;"
        onclick="resendOTP()">

            Resend OTP

        </button>

    </div>

</div>

<script>
if(localStorage.getItem("accountCreated")){

    window.location.href = "signup.html";

}

/* EMAILJS */

emailjs.init("ZLApUHPsYvYFuwOvo");

/* OTP INPUTS */

const inputs = document.querySelectorAll(".otp-inputs input");

/* AUTO MOVE */

inputs.forEach((input,index)=>{

    input.addEventListener("keyup",()=>{

        if(input.value.length === 1){

            if(inputs[index + 1]){

                inputs[index + 1].focus();

            }

        }

    });

});

/* SEND OTP */

function sendOTP(){

    let otp = Math.floor(100000 + Math.random() * 900000);

    localStorage.setItem("otp", otp);

    localStorage.setItem("otpExpire", Date.now() + 30000);

    emailjs.send(
        "service_91rw6tr",
        "template_xwmyjxq",
        {
            to_email: email,
            otp_code: otp
        }
    )


    .then(()=>{

        alert("OTP Sent");

        document.getElementById("loginPage").style.display = "none";

        document.getElementById("otpPage").style.display = "block";

        startTimer();

    });

}

/* TIMER */

let timer;

function startTimer(){

    clearInterval(timer);

    let time = 30;

    document.getElementById("count").innerText = time;

    document.getElementById("resendBtn").style.display = "none";

    timer = setInterval(()=>{

        time--;

        document.getElementById("count").innerText = time;

        if(time <= 0){

            clearInterval(timer);

            document.getElementById("resendBtn").style.display = "block";

        }

    },1000);

}

/* RESEND */

function resendOTP(){

    sendOTP();

}

/* VERIFY */

function verifyOTP(){

    let enteredOtp = "";

    inputs.forEach(input=>{

        enteredOtp += input.value;

    });

    let realOtp = localStorage.getItem("otp");

    let expireTime = localStorage.getItem("otpExpire");

    if(Date.now() > expireTime){

        alert("OTP Expired");

        return;

    }

    if(enteredOtp == realOtp){

    localStorage.setItem(
	"accountCreated",
	"true"
);

	alert("Login Success ✅");

	window.location.href =
	"profile.html";

    }else{

        alert("Wrong OTP");

    }

}

</script>

</body>
</html>
