<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>BuildWithHariOfficialWeb</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top,
    #1b1464 0%,
    #050816 45%,
    #020617 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
}

.box{
    width:100%;
    max-width:420px;
    background:rgba(17,24,39,0.85);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:30px;
    padding:40px 30px;
    box-shadow:
    0 0 40px rgba(124,58,237,0.15);
}

.top-logo{
    text-align:center;
    margin-bottom:25px;
}

.top-logo img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:20px;
}

.main-title{
    text-align:center;
    font-size:42px;
    font-weight:700;
    color:#e9d5ff;
}

.sub-title{
    text-align:center;
    color:#94a3b8;
    margin-top:8px;
    margin-bottom:35px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:10px;
    font-size:15px;
    color:#ffffff;
}

.input-area{
    width:100%;
    height:58px;
    background:#020617;
    border:2px solid rgba(250,204,21,0.5);
    border-radius:16px;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:12px;
}

.input-area i{
    color:#64748b;
    font-size:18px;
}

.input-area input{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
}

.input-area input::placeholder{
    color:#64748b;
}

button{
    width:100%;
    height:58px;
    border:none;
    border-radius:18px;
    background:linear-gradient(to right,
    #c4b5fd,
    #7c3aed);
    color:black;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    margin-top:15px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.02);
}

#otpPage{
    display:none;
}

.otp-inputs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.otp-inputs input{
    width:50px;
    height:60px;
    border-radius:14px;
    border:2px solid rgba(250,204,21,0.4);
    background:#020617;
    color:white;
    text-align:center;
    font-size:22px;
    outline:none;
}

.timer{
    text-align:center;
    margin-top:20px;
    color:#facc15;
    font-size:15px;
}

#resendBtn{
    display:none;
    margin-top:18px;
}

@media(max-width:768px){

    .box{
        padding:30px 20px;
        border-radius:24px;
    }

    .main-title{
        font-size:34px;
    }

    .otp-inputs input{
        width:45px;
        height:55px;
    }

}

</style>
</head>
<body>

<div class="box">

    <div class="top-logo">

        <img src="logo.png" alt="Logo">

    </div>

    <!-- LOGIN PAGE -->

    <div id="loginPage">

        <h1 class="main-title">
            BUILD WITH HARI
        </h1>

        <p class="sub-title">
            Sign in to continue
        </p>

        <div class="input-box">

            <label>
                Full Name
            </label>

            <div class="input-area">

                <i class="fa-regular fa-user"></i>

                <input type="text"
                id="name"
                placeholder="Enter your name">

            </div>

        </div>

        <div class="input-box">

            <label>
                Email Address
            </label>

            <div class="input-area">

                <i class="fa-regular fa-envelope"></i>

                <input type="email"
                id="email"
                placeholder="you@example.com">

            </div>

        </div>

        <button onclick="sendOTP()">

            <i class="fa-solid fa-key"></i>

            Send OTP

        </button>

    </div>

    <!-- OTP PAGE -->

    <div id="otpPage">

        <h1 class="main-title">
            Verify OTP
        </h1>

        <p class="sub-title">
            Enter the OTP sent to your email
        </p>

        <div class="otp-inputs">

            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">

        </div>

        <button onclick="verifyOTP()">

            Verify OTP

        </button>

        <div class="timer">

            Time Left :
            <span id="count">30</span>s

        </div>

        <button id="resendBtn"
        onclick="resendOTP()">

            Resend OTP

        </button>

    </div>

</div>

<script>

/* EMAILJS */

emailjs.init("ZLApUHPsYvYFuwOvo");

/* OTP INPUT */

const inputs =
document.querySelectorAll(
".otp-inputs input"
);

/* AUTO MOVE */

inputs.forEach((input,index)=>{

    input.addEventListener("keyup",()=>{

        if(input.value.length === 1){

            if(inputs[index + 1]){

                inputs[index + 1].focus();

            }

        }

    });

});

/* SEND OTP */

async function sendOTP(){

    let name =
    document.getElementById("name").value;

    let email =
    document.getElementById("email").value;

    if(name === ""){

        alert("Enter Name");
        return;

    }

    if(email === ""){

        alert("Enter Email");
        return;

    }

    /* BLOCK CHECK */

    let isBlocked =
    await checkBlockedEmail(email);

    if(isBlocked){

        alert("This Email Is Blocked ❌");
        return;

    }

    let otp =
    Math.floor(
    100000 + Math.random() * 900000
    );

    localStorage.setItem("otp", otp);

    localStorage.setItem(
    "otpExpire",
    Date.now() + 30000
    );

    emailjs.send(
        "service_91rw6tr",
        "template_xwmyjxq",
        {
            to_email: email,
            otp_code: otp
        }
    )

    .then(()=>{

        alert("OTP Sent Successfully ✅");

        document.getElementById(
        "loginPage").style.display =
        "none";

        document.getElementById(
        "otpPage").style.display =
        "block";

        startTimer();

    })

    .catch((error)=>{

        alert("OTP Send Failed ❌");

        console.log(error);

    });

}

/* TIMER */

let timer;

function startTimer(){

    clearInterval(timer);

    let time = 30;

    document.getElementById(
    "count").innerText = time;

    document.getElementById(
    "resendBtn").style.display =
    "none";

    timer = setInterval(()=>{

        time--;

        document.getElementById(
        "count").innerText = time;

        if(time <= 0){

            clearInterval(timer);

            document.getElementById(
            "resendBtn").style.display =
            "block";

        }

    },1000);

}

/* RESEND OTP */

function resendOTP(){

    sendOTP();

}

/* VERIFY OTP */

function verifyOTP(){

    let enteredOtp = "";

    inputs.forEach(input=>{

        enteredOtp += input.value;

    });

    let realOtp =
    localStorage.getItem("otp");

    let expireTime =
    localStorage.getItem("otpExpire");

    if(Date.now() > expireTime){

        alert("OTP Expired ❌");

        return;

    }

    if(enteredOtp == realOtp){

        let name =
        document.getElementById("name").value;

        let email =
        document.getElementById("email").value;

        localStorage.setItem(
        "profileName",
        name
        );

        localStorage.setItem(
        "profileEmail",
        email
        );

        localStorage.setItem(
        "accountCreated",
        "true"
        );

        /* FIREBASE SAVE */

        saveUserToFirebase(
        name,
        email
        );

        alert("Login Success ✅");

        window.location.href =
        "profile.html";

    }

    else{

        alert("Wrong OTP ❌");

    }

}

</script>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
getDocs,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyC2wF7KID1lxdcvNGl-ExUmjetgYO4G4lA",

  authDomain: "buildwithhari-cf274.firebaseapp.com",

  projectId: "buildwithhari-cf274",

  storageBucket: "buildwithhari-cf274.appspot.com",

  messagingSenderId: "112190919400",

  appId: "1:112190919400:web:424eaf26944ba3848b2f5d"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* SAVE USER */

window.saveUserToFirebase =
async function(name,email){

    try{

        const q = query(
            collection(db,"users"),
            where("email","==",email)
        );

        const querySnapshot =
        await getDocs(q);

        if(querySnapshot.empty){

            await addDoc(
            collection(db,"users"),{

                name:name,
                email:email

            });

            console.log("User Saved");

        }

    }catch(error){

        console.log(error);

    }

}

/* CHECK BLOCKED EMAIL */

window.checkBlockedEmail =
async function(email){

    try{

        const blockedRef =
        doc(db,"blockedEmails",email);

        const blockedSnap =
        await getDoc(blockedRef);

        if(blockedSnap.exists()){

            return true;

        }else{

            return false;

        }

    }catch(error){

        console.log(error);

        return false;

    }

}

</script>

</body>
</html>
