<!DOCTYPE html>
<html>
<head>
<title>BuildWithHari Player</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* BODY */
body{
    background:#0f0f0f;
    color:white;
}

/* TOP BAR */
.topbar{
    height:56px;
    display:flex;
    align-items:center;
    padding:0 16px;
    background:#0f0f0f;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
}

.logo{
    font-size:18px;
    font-weight:bold;
}

/* MAIN CONTAINER */
.container{
    max-width:1100px;
    margin:auto;
    padding:10px;
}

/* PLAYER BOX */
.player-box{
    width:100%;
    aspect-ratio:16/9;
    background:black;
    border-radius:12px;
    overflow:hidden;
}

/* VIDEO INFO */
.video-info{
    padding:12px 4px;
}

/* TITLE */
.title{
    font-size:18px;
    font-weight:600;
    margin-top:10px;
}

/* SUB TEXT */
.sub{
    font-size:13px;
    color:#aaa;
    margin-top:5px;
}

/* MOBILE */
@media(max-width:768px){

    .container{
        padding:0;
    }

    .player-box{
        border-radius:0;
    }

    .video-info{
        padding:10px;
    }

    .title{
        font-size:16px;
    }

}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">▶ BuildWithHari Player</div>
</div>

<!-- MAIN -->
<div class="container">

    <!-- VIDEO -->
    <div class="player-box">
        <div id="player"></div>
    </div>

    <!-- TITLE BELOW VIDEO -->
    <div class="video-info">

        <div class="title" id="videoTitle">
            Loading video...
        </div>

        <div class="sub">
            BuildWithHari • Watch Video
        </div>

    </div>

</div>

<script>

/* GET VIDEO ID */
let id = localStorage.getItem("videoId");

/* LOAD YOUTUBE API */
let tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

let player;

/* INIT PLAYER */
function onYouTubeIframeAPIReady(){

    player = new YT.Player("player", {

        width:"100%",
        height:"100%",
        videoId:id,

        playerVars:{
            autoplay:1,
            controls:1,
            rel:0,
            modestbranding:1
        },

        events:{
            onReady: onReady,
            onStateChange: onPlayerStateChange
        }

    });

}

/* WHEN READY → GET TITLE */
function onReady(){

    let videoData = player.getVideoData();

    document.getElementById("videoTitle").innerText =
    videoData.title || "Unknown Title";
}

/* VIDEO FINISH LOGIC */
function onPlayerStateChange(event){

    if(event.data === YT.PlayerState.ENDED){

        let finishedVideos =
        JSON.parse(localStorage.getItem("finishedVideos")) || [];

        if(!finishedVideos.includes(id)){
            finishedVideos.push(id);
            localStorage.setItem("finishedVideos", JSON.stringify(finishedVideos));
        }

        alert("✅ Video Finished");

        window.location.href = "videos.html";
    }

}

</script>

</body>
</html>
