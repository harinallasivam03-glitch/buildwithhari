<!DOCTYPE html>
<html>
<head>
<title>Watch Video</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#030712;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    height:100dvh; /* mobile fix */
    overflow:hidden;
}

/* VIDEO BOX */

.video-box{
    width:95%;
    max-width:1200px;
    background:#111827;
    padding:15px;
    border-radius:24px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* TITLE */

.title{
    color:white;
    font-size:28px;
    margin-bottom:15px;
    text-align:center;
    font-family:Arial,sans-serif;
}

/* PLAYER */

#player{
    width:100%;
    height:80vh;
    border-radius:18px;
    overflow:hidden;
}

/* MOBILE */

@media(max-width:768px){

    body{
        padding:0;
    }

    .video-box{
        width:100%;
        height:100dvh;
        border-radius:0;
        padding:10px;
        padding-top: calc(10px + env(safe-area-inset-top));
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }

    #player{
        height:88dvh;
        border-radius:12px;
    }

    .title{
        font-size:18px;
        margin-bottom:10px;
    }

}

</style>
</head>

<body>

<div class="video-box">

    <h1 class="title">
        BuildWithHari Video Player
    </h1>

    <div id="player"></div>

</div>

<script>

let id = localStorage.getItem("videoId");

let tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

let player;

function onYouTubeIframeAPIReady(){

    player = new YT.Player("player", {

        height:"100%",
        width:"100%",
        videoId:id,

        playerVars:{
            autoplay:1,
            controls:1,
            rel:0,
            modestbranding:1
        },

        events:{
            "onStateChange": onPlayerStateChange
        }

    });

}

function onPlayerStateChange(event){

    if(event.data === YT.PlayerState.ENDED){

        let finishedVideos =
        JSON.parse(localStorage.getItem("finishedVideos")) || [];

        if(!finishedVideos.includes(id)){
            finishedVideos.push(id);

            localStorage.setItem(
                "finishedVideos",
                JSON.stringify(finishedVideos)
            );
        }

        alert("✅ Level Finished");

        window.location.href = "videos.html";
    }
}

</script>

</body>
</html>
