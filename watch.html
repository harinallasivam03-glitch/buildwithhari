<!DOCTYPE html>
<html>
<head>
<title>YouTube Style Player</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f; /* YouTube dark */
    color:white;
}

/* TOP BAR (YouTube style) */

.topbar{
    height:56px;
    display:flex;
    align-items:center;
    padding:0 16px;
    background:#0f0f0f;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
}

.logo{
    font-size:18px;
    font-weight:bold;
    color:white;
}

/* MAIN CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    padding:10px;
}

/* PLAYER */

.player-box{
    width:100%;
    aspect-ratio:16/9;
    background:black;
    border-radius:12px;
    overflow:hidden;
}

/* TITLE */

.title{
    font-size:18px;
    margin-top:12px;
    font-weight:600;
}

/* STATUS */

.sub{
    font-size:13px;
    color:#aaa;
    margin-top:4px;
}

/* MOBILE */

@media(max-width:768px){

    .container{
        padding:0;
    }

    .player-box{
        border-radius:0;
    }

    .title{
        padding:10px;
        font-size:16px;
    }

    .sub{
        padding:0 10px;
    }

}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">▶ YouTube Style Player</div>
</div>

<!-- MAIN -->
<div class="container">

    <div class="player-box">
        <div id="player"></div>
    </div>

    <div class="title" id="videoTitle">
        Loading video...
    </div>

    <div class="sub">
        BuildWithHari • Watch Video
    </div>

</div>

<script>

let id = localStorage.getItem("videoId");

/* YouTube API */
let tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

let player;

function onYouTubeIframeAPIReady(){

    player = new YT.Player("player", {

        width:"100%",
        height:"100%",
        videoId:id,

        playerVars:{
            autoplay:1,
            controls:1,
            rel:0,
            modestbranding:1
        },

        events:{
            onReady: (e)=>{
                document.getElementById("videoTitle").innerText =
                "Now Playing Video ID: " + id;
            },
            onStateChange: onPlayerStateChange
        }

    });

}

/* VIDEO END */

function onPlayerStateChange(event){

    if(event.data === YT.PlayerState.ENDED){

        let finishedVideos =
        JSON.parse(localStorage.getItem("finishedVideos")) || [];

        if(!finishedVideos.includes(id)){
            finishedVideos.push(id);
            localStorage.setItem("finishedVideos", JSON.stringify(finishedVideos));
        }

        alert("Video Finished ✅");

        window.location.href = "videos.html";
    }

}

</script>

</body>
</html>
