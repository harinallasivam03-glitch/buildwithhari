<!DOCTYPE html>
<html>
<head>
<title>Watch Video</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#030712;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* VIDEO BOX */

.video-box{
    width:95%;
    max-width:1200px;
    background:#111827;
    padding:15px;
    border-radius:24px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* IFRAME */

iframe{
    width:100%;
    height:80vh;
    border:none;
    border-radius:18px;
}

/* TITLE */

.title{
    color:white;
    font-size:28px;
    margin-bottom:15px;
    text-align:center;
    font-family:Arial,sans-serif;
}

/* MOBILE */

@media(max-width:768px){

    .video-box{
        width:100%;
        height:100vh;
        border-radius:0;
        padding:10px;
    }

    iframe{
        height:88vh;
        border-radius:12px;
    }

    .title{
        font-size:20px;
    }

}

</style>
</head>

<body>

<div class="video-box">

    <h1 class="title">
        BuildWithHari Video Player
    </h1>

    <div id="player"></div>

</div>

<script>

/* GET VIDEO ID */

let id =
localStorage.getItem("videoId");

/* LOAD YOUTUBE API */

let tag =
document.createElement("script");

tag.src =
"https://www.youtube.com/iframe_api";

document.body.appendChild(tag);

let player;

/* API READY */

function onYouTubeIframeAPIReady(){

    player = new YT.Player(

        "player",

        {

            height:"100%",

            width:"100%",

            videoId:id,

            playerVars:{

                autoplay:1

            },

            events:{

                "onStateChange":
                onPlayerStateChange

            }

        }

    );

}

/* VIDEO STATUS */

function onPlayerStateChange(event){

    /* VIDEO FINISHED */

    if(event.data === YT.PlayerState.ENDED){

        let finishedVideos =

        JSON.parse(

        localStorage.getItem(
        "finishedVideos"
        )

        ) || [];

        /* SAVE FINISHED */

        if(!finishedVideos.includes(id)){

            finishedVideos.push(id);

            localStorage.setItem(

                "finishedVideos",

                JSON.stringify(
                finishedVideos
                )

            );

        }

        /* ALERT */

        alert(
        "✅ Level Finished"
        );

        /* BACK */

        window.location.href =
        "videos.html";

    }

}

</script>

</body>
</html>
