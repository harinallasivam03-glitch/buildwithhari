<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Projects Page</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#020617;
    color:white;
    padding:25px;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:35px;
}

.top h1{
    font-size:42px;
}

/* UPLOAD */

.upload-box{
    width:340px;
    background:#111827;
    padding:20px;
    border-radius:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.upload-box input{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    padding:0 14px;
    background:#1e293b;
    color:white;
}

.upload-box input[type="file"]{
    padding:12px;
    height:auto;
}

.upload-btn{
    height:50px;
    border:none;
    border-radius:12px;
    background:#7c3aed;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:600;
}

.upload-btn:hover{
    background:#6d28d9;
}

/* GRID */

.projects-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

/* CARD */

.card{
    background:
    linear-gradient(145deg,#111827,#020617);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:25px;
    padding:28px;
    text-align:center;
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#1e293b;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    font-weight:700;
    color:#c4b5fd;
}

.user-name{
    margin-top:20px;
    font-size:28px;
}

.user-id{
    margin-top:10px;
    color:#94a3b8;
    font-size:15px;
}

.open-btn{
    margin-top:25px;
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
    font-weight:600;
}

.open-btn:hover{
    background:#16a34a;
}

/* PROJECT PAGE */

.project-page{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#020617;
    padding:25px;
    overflow:auto;
    display:none;
    z-index:1000;
}

.back-btn{
    background:#dc2626;
    border:none;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:25px;
}

.project-card{
    background:#111827;
    padding:25px;
    border-radius:22px;
}

.project-card h1{
    margin-bottom:20px;
}

.project-buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.site-btn{
    background:#22c55e;
    border:none;
    padding:14px 20px;
    border-radius:12px;
    color:white;
    cursor:pointer;
    font-weight:600;
}

.files-btn{
    background:#2563eb;
    border:none;
    padding:14px 20px;
    border-radius:12px;
    color:white;
    cursor:pointer;
    font-weight:600;
}

/* FILE LIST */

.files-list{
    margin-top:25px;
    display:none;
    flex-direction:column;
    gap:15px;
}

.file-item{
    background:#1e293b;
    padding:16px;
    border-radius:14px;
    cursor:pointer;
}

.file-item:hover{
    background:#334155;
}

/* FILE VIEWER */

.viewer{
    margin-top:25px;
    background:#0f172a;
    border-radius:18px;
    padding:20px;
    display:none;
}

.viewer pre{
    white-space:pre-wrap;
    color:#00ff99;
    overflow:auto;
}

/* MOBILE */

@media(max-width:768px){

    body{
        padding:15px;
    }

    .top h1{
        font-size:30px;
    }

    .upload-box{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- TOP -->

<div class="top">

    <h1>Projects Page</h1>

    <div class="upload-box">

        <input type="text"
        id="userName"
        placeholder="Enter User Name">

        <input type="text"
        id="userId"
        placeholder="Enter User ID">

        <input type="text"
        id="websiteLink"
        placeholder="Enter Website Link">

        <input type="file"
        id="projectFiles"
        multiple>

        <button class="upload-btn"
        onclick="uploadProject()">

            Upload Project

        </button>

    </div>

</div>

<!-- USER CARDS -->

<div class="projects-grid"
id="projectsGrid">

</div>

<!-- PROJECT PAGE -->

<div class="project-page"
id="projectPage">

    <button class="back-btn"
    onclick="closeProject()">

        ← Back

    </button>

    <div class="project-card">

        <h1 id="projectTitle">
            Project
        </h1>

        <div class="project-buttons">

            <button class="site-btn"
            id="websiteBtn">

                Open Website

            </button>

            <button class="files-btn"
            onclick="toggleFiles()">

                Open Files

            </button>

        </div>

        <!-- FILE LIST -->

        <div class="files-list"
        id="filesList">

        </div>

        <!-- FILE VIEWER -->

        <div class="viewer"
        id="viewer">

            <pre id="fileContent"></pre>

        </div>

    </div>

</div>

<script>

/* PROJECT STORAGE */

let projects = [];

/* LOAD USER CARDS */

function loadProjects(){

    let html = "";

    projects.forEach((project,index)=>{

        let firstLetter =
        project.name.charAt(0)
        .toUpperCase();

        html += `

        <div class="card">

            <div class="avatar">
                ${firstLetter}
            </div>

            <h2 class="user-name">
                ${project.name}
            </h2>

            <p class="user-id">
                ID : ${project.id}
            </p>

            <button class="open-btn"
            onclick="openProject(${index})">

                Open

            </button>

        </div>

        `;

    });

    document.getElementById(
    "projectsGrid"
    ).innerHTML = html;

}

/* UPLOAD PROJECT */

function uploadProject(){

    let userName =
    document.getElementById(
    "userName"
    ).value;

    let userId =
    document.getElementById(
    "userId"
    ).value;

    let websiteLink =
    document.getElementById(
    "websiteLink"
    ).value;

    let files =
    document.getElementById(
    "projectFiles"
    ).files;

    if(userName === ""
    || userId === ""
    || websiteLink === ""){

        alert("Fill All Details");

        return;

    }

    if(files.length === 0){

        alert("Select Files");

        return;

    }

    let fileArray = [];

    let loaded = 0;

    for(let i=0;i<files.length;i++){

        let reader =
        new FileReader();

        reader.onload = function(e){

            fileArray.push({

                fileName:
                files[i].name,

                content:
                e.target.result

            });

            loaded++;

            if(loaded === files.length){

                projects.push({

                    name:userName,

                    id:userId,

                    website:websiteLink,

                    files:fileArray

                });

                loadProjects();

                alert("Project Uploaded ✅");

            }

        }

        reader.readAsText(
        files[i]
        );

    }

}

/* OPEN PROJECT PAGE */

function openProject(index){

    let project =
    projects[index];

    document.getElementById(
    "projectPage"
    ).style.display =
    "block";

    document.getElementById(
    "projectTitle"
    ).innerText =
    project.name + " Project";

    document.getElementById(
    "websiteBtn"
    ).onclick = function(){

        window.open(
        project.website,
        "_blank"
        );

    }

    let filesHTML = "";

    project.files.forEach((file)=>{

        filesHTML += `

        <div class="file-item"
        onclick="openFile(
        \`${file.content}\`
        )">

            📄 ${file.fileName}

        </div>

        `;

    });

    document.getElementById(
    "filesList"
    ).innerHTML =
    filesHTML;

}

/* SHOW FILE LIST */

function toggleFiles(){

    let list =
    document.getElementById(
    "filesList"
    );

    if(list.style.display ===
    "flex"){

        list.style.display =
        "none";

    }else{

        list.style.display =
        "flex";

    }

}

/* OPEN FILE */

function openFile(content){

    document.getElementById(
    "viewer"
    ).style.display =
    "block";

    document.getElementById(
    "fileContent"
    ).innerText =
    content;

}

/* CLOSE PROJECT */

function closeProject(){

    document.getElementById(
    "projectPage"
    ).style.display =
    "none";

}

</script>

</body>
</html>
