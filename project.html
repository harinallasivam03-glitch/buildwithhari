<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Projects</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#030712;
    color:white;
    padding:25px;
}

/* TOP */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:15px;
}

.topbar h1{
    font-size:40px;
}

/* UPLOAD BUTTON */

.upload-btn{
    background:#7c3aed;
    color:white;
    border:none;
    padding:14px 22px;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

.upload-btn:hover{
    background:#6d28d9;
}

/* FILE BOX */

.upload-box{
    display:none;
    background:#111827;
    padding:25px;
    border-radius:20px;
    margin-bottom:30px;
}

.upload-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:18px;
    background:#1e293b;
    color:white;
}

.upload-submit{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
}

/* PROJECT GRID */

.projects{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

/* CARD */

.project-card{
    background:#111827;
    border-radius:22px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.05);
}

.project-top{
    padding:20px;
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.user-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#facc15;
    color:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:700;
}

.user-info h2{
    font-size:22px;
}

.user-info p{
    color:#94a3b8;
    margin-top:4px;
}

/* PROJECT CONTENT */

.project-content{
    padding:20px;
}

.project-content h3{
    margin-bottom:12px;
    font-size:24px;
}

.project-content p{
    color:#94a3b8;
    line-height:28px;
    margin-bottom:20px;
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.open-btn{
    flex:1;
    height:48px;
    border:none;
    border-radius:12px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

.file-btn{
    flex:1;
    height:48px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
}

/* MOBILE */

@media(max-width:768px){

    body{
        padding:15px;
    }

    .topbar h1{
        font-size:30px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<!-- TOP -->

<div class="topbar">

    <h1>Student Projects</h1>

    <button class="upload-btn"
    onclick="showUpload()">

        <i class="fa-solid fa-upload"></i>
        Upload Files

    </button>

</div>

<!-- UPLOAD SECTION -->

<div class="upload-box"
id="uploadBox">

    <input type="text"
    id="projectName"
    placeholder="Project Name">

    <input type="text"
    id="projectDesc"
    placeholder="Project Description">

    <input type="text"
    id="websiteLink"
    placeholder="Website Link">

    <input type="file"
    id="projectFile">

    <button class="upload-submit"
    onclick="uploadProject()">

        Upload Project

    </button>

</div>

<!-- PROJECTS -->

<div class="projects"
id="projectsContainer">

</div>

<script>

/* SHOW UPLOAD */

function showUpload(){

    let box =
    document.getElementById(
    "uploadBox"
    );

    if(box.style.display==="block"){

        box.style.display="none";

    }else{

        box.style.display="block";

    }

}

/* LOAD PROJECTS */

function loadProjects(){

    let projects =
    JSON.parse(
    localStorage.getItem("projects")
    ) || [];

    let html = "";

    projects.forEach((project,index)=>{

        let firstLetter =
        project.userName
        .charAt(0)
        .toUpperCase();

        html += `

        <div class="project-card">

            <div class="project-top">

                <div class="user-info">

                    <div class="avatar">

                        ${firstLetter}

                    </div>

                    <div>

                        <h2>
                        ${project.userName}
                        </h2>

                        <p>
                        Uploaded Project
                        </p>

                    </div>

                </div>

            </div>

            <div class="project-content">

                <h3>
                ${project.projectName}
                </h3>

                <p>
                ${project.projectDesc}
                </p>

                <div class="buttons">

                    <button class="open-btn"
                    onclick="openWebsite('${project.websiteLink}')">

                        Open Website

                    </button>

                    <button class="file-btn"
                    onclick="openFiles('${project.fileName}')">

                        Open Files

                    </button>

                </div>

            </div>

        </div>

        `;

    });

    document.getElementById(
    "projectsContainer"
    ).innerHTML = html;

}

/* UPLOAD PROJECT */

function uploadProject(){

    let userName =
    localStorage.getItem(
    "profileName"
    ) || "User";

    let projectName =
    document.getElementById(
    "projectName"
    ).value;

    let projectDesc =
    document.getElementById(
    "projectDesc"
    ).value;

    let websiteLink =
    document.getElementById(
    "websiteLink"
    ).value;

    let fileInput =
    document.getElementById(
    "projectFile"
    );

    if(projectName===""){

        alert("Enter Project Name");

        return;

    }

    let fileName = "No File";

    if(fileInput.files.length>0){

        fileName =
        fileInput.files[0].name;

    }

    let projects =
    JSON.parse(
    localStorage.getItem("projects")
    ) || [];

    projects.push({

        userName:userName,

        projectName:projectName,

        projectDesc:projectDesc,

        websiteLink:websiteLink,

        fileName:fileName

    });

    localStorage.setItem(
    "projects",
    JSON.stringify(projects)
    );

    alert("Project Uploaded ✅");

    loadProjects();

    document.getElementById(
    "projectName"
    ).value="";

    document.getElementById(
    "projectDesc"
    ).value="";

    document.getElementById(
    "websiteLink"
    ).value="";

    document.getElementById(
    "projectFile"
    ).value="";

}

/* OPEN WEBSITE */

function openWebsite(link){

    if(link===""){

        alert("No Website Link");

        return;

    }

    window.open(link,"_blank");

}

/* OPEN FILE */

function openFiles(file){

    alert(
    "File Name : "+file
    );

}

/* PAGE LOAD */

loadProjects();

</script>

</body>
</html>
