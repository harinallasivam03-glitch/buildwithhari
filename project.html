<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Projects</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#020617;
    color:white;
    padding:25px;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:15px;
}

.top h1{
    font-size:42px;
}

.upload-btn{
    background:linear-gradient(to right,#7c3aed,#2563eb);
    border:none;
    color:white;
    padding:14px 24px;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

/* POPUP */

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup-box{
    width:95%;
    max-width:500px;
    background:#0f172a;
    padding:25px;
    border-radius:24px;
}

.popup-box h2{
    margin-bottom:20px;
}

.input-box{
    margin-top:18px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
}

.input-box input{
    width:100%;
    height:55px;
    border:none;
    outline:none;
    border-radius:14px;
    padding:0 15px;
    background:#1e293b;
    color:white;
}

.file-box{
    margin-top:18px;
}

.file-box input{
    margin-top:10px;
}

.save-btn{
    width:100%;
    margin-top:22px;
    height:55px;
    border:none;
    border-radius:14px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
    font-weight:600;
}

/* PROJECT GRID */

.projects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}

.card{
    background:linear-gradient(145deg,#111827,#0b1220);
    border-radius:24px;
    padding:25px;
    border:1px solid rgba(255,255,255,0.05);
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#1e1b4b;
    border:1px solid rgba(255,255,255,0.1);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    font-weight:700;
    margin:auto;
    color:#c4b5fd;
}

.card h2{
    text-align:center;
    margin-top:18px;
    font-size:24px;
}

.card p{
    text-align:center;
    color:#94a3b8;
    margin-top:10px;
}

.open-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    background:#7c3aed;
    color:white;
    margin-top:22px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

/* VIEW PAGE */

.viewer{
    display:none;
}

.viewer-card{
    background:#111827;
    padding:25px;
    border-radius:24px;
}

.website-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:14px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
    font-weight:600;
}

.files-title{
    margin-top:28px;
    margin-bottom:18px;
}

.file-item{
    background:#1e293b;
    padding:16px;
    border-radius:14px;
    margin-bottom:12px;
    cursor:pointer;
}

.file-item:hover{
    background:#334155;
}

.text-view{
    margin-top:25px;
    background:black;
    color:#22c55e;
    padding:20px;
    border-radius:16px;
    white-space:pre-wrap;
    overflow:auto;
    max-height:400px;
}

.back-btn{
    margin-bottom:20px;
    background:#dc2626;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
}

@media(max-width:768px){

    body{
        padding:15px;
    }

    .top h1{
        font-size:30px;
    }

}

</style>
</head>
<body>

<!-- MAIN PAGE -->

<div id="mainPage">

    <div class="top">

        <h1>Projects</h1>

        <button class="upload-btn"
        onclick="openPopup()">
            Upload Project
        </button>

    </div>

    <div class="projects"
    id="projects"></div>

</div>

<!-- VIEW PAGE -->

<div class="viewer"
id="viewerPage">

    <button class="back-btn"
    onclick="goBack()">
        ← Back
    </button>

    <div class="viewer-card">

        <h1 id="viewName"></h1>

        <p id="viewId"
        style="margin-top:10px;color:#94a3b8;"></p>

        <button class="website-btn"
        id="websiteBtn">
            Open Website
        </button>

        <h2 class="files-title">
            Open Files
        </h2>

        <div id="filesList"></div>

        <div class="text-view"
        id="textView">
            Select any file to read...
        </div>

    </div>

</div>

<!-- POPUP -->

<div class="popup"
id="popup">

    <div class="popup-box">

        <h2>Upload Project</h2>

        <div class="input-box">

            <label>User Name</label>

            <input type="text"
            id="userName"
            placeholder="Enter your name">

        </div>

        <div class="input-box">

            <label>Website Link</label>

            <input type="text"
            id="websiteLink"
            placeholder="https://example.com">

        </div>

        <div class="file-box">

            <label>Select Files</label>

            <input type="file"
            id="files"
            multiple>

        </div>

        <button class="save-btn"
        onclick="saveProject()">
            Save Project
        </button>

    </div>

</div>

<script>

/* LOAD PROJECTS */

let allProjects = JSON.parse(
localStorage.getItem("projects")
) || [];

/* RENDER PROJECTS */

function renderProjects(){

    let projectsDiv =
    document.getElementById("projects");

    projectsDiv.innerHTML = "";

    if(allProjects.length === 0){

        projectsDiv.innerHTML = `
        
        <h2 style="
        color:#94a3b8;
        font-weight:500;
        ">
            No Projects Uploaded
        </h2>

        `;

        return;
    }

    allProjects.forEach((project,index)=>{

        let first =
        project.name.charAt(0)
        .toUpperCase();

        let card = `

        <div class="card">

            <div class="avatar">
                ${first}
            </div>

            <h2>${project.name}</h2>

            <p style="margin-top:10px;">
                USER ID : ${project.id}
            </p>

            <button class="open-btn"
            onclick="openProject(${index})">
                Open
            </button>

        </div>

        `;

        projectsDiv.innerHTML += card;

    });

}

/* FIRST LOAD */

renderProjects();

/* OPEN POPUP */

function openPopup(){

    document.getElementById(
    "popup"
    ).style.display = "flex";

}

/* CLOSE POPUP */

window.onclick = function(e){

    if(e.target.id === "popup"){

        document.getElementById(
        "popup"
        ).style.display = "none";

    }

}

/* SAVE PROJECT */

async function saveProject(){

    let name =
    document.getElementById(
    "userName"
    ).value.trim();

    let website =
    document.getElementById(
    "websiteLink"
    ).value.trim();

    let files =
    document.getElementById(
    "files"
    ).files;

    if(name === ""){

        alert("Enter User Name");
        return;

    }

    if(website === ""){

        alert("Enter Website Link");
        return;

    }

    let fileData = [];

    /* READ FILES */

    for(let file of files){

        let text =
        await file.text();

        fileData.push({

            fileName:file.name,

            content:text

        });

    }

    /* CREATE PROJECT */

    let project = {

        id:"USER" +
        Date.now(),

        name:name,

        website:website,

        files:fileData

    };

    /* SAVE */

    allProjects.push(project);

    localStorage.setItem(
    "projects",
    JSON.stringify(allProjects)
    );

    /* REFRESH */

    renderProjects();

    /* RESET */

    document.getElementById(
    "userName"
    ).value = "";

    document.getElementById(
    "websiteLink"
    ).value = "";

    document.getElementById(
    "files"
    ).value = "";

    document.getElementById(
    "popup"
    ).style.display = "none";

    alert("Project Saved Successfully ✅");

}

/* OPEN PROJECT */

function openProject(index){

    let project =
    allProjects[index];

    document.getElementById(
    "mainPage"
    ).style.display = "none";

    document.getElementById(
    "viewerPage"
    ).style.display = "block";

    document.getElementById(
    "viewName"
    ).innerText =
    project.name;

    document.getElementById(
    "viewId"
    ).innerText =
    "USER ID : " + project.id;

    /* WEBSITE BUTTON */

    document.getElementById(
    "websiteBtn"
    ).onclick = function(){

        let url = project.website;

        if(
        !url.startsWith("http://")
        &&
        !url.startsWith("https://")
        ){

            url = "https://" + url;

        }

        window.open(url,"_blank");

    }

    /* FILES */

    let html = "";

    project.files.forEach((file)=>{

        html += `

        <div class="file-item"
        onclick="openFile(${index},
        '${file.fileName}')">

            ${file.fileName}

        </div>

        `;

    });

    document.getElementById(
    "filesList"
    ).innerHTML = html;

    document.getElementById(
    "textView"
    ).innerText =
    "Select any file to read...";

}

/* OPEN FILE */

function openFile(projectIndex,fileName){

    let project =
    allProjects[projectIndex];

    let selectedFile =
    project.files.find(
    file => file.fileName === fileName
    );

    document.getElementById(
    "textView"
    ).innerText =
    selectedFile.content;

}

/* BACK */

function goBack(){

    document.getElementById(
    "viewerPage"
    ).style.display = "none";

    document.getElementById(
    "mainPage"
    ).style.display = "block";

}

</script>

</body>
</html>
