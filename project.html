<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Projects Page</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#020617;
    color:white;
    padding:25px;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
    flex-wrap:wrap;
    gap:20px;
}

.top h1{
    font-size:42px;
}

.upload-box{
    background:#111827;
    padding:18px;
    border-radius:20px;
    display:flex;
    gap:12px;
    align-items:center;
    flex-wrap:wrap;
}

.upload-box input{
    color:white;
}

.upload-btn{
    background:#7c3aed;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    color:white;
    cursor:pointer;
    font-weight:600;
}

.upload-btn:hover{
    background:#6d28d9;
}

/* GRID */

.projects-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

/* CARD */

.card{
    background:
    linear-gradient(145deg,#111827,#020617);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:25px;
    padding:25px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#1e293b;
    border:1px solid rgba(255,255,255,0.1);
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:700;
    color:#c4b5fd;
}

.name{
    text-align:center;
    margin-top:20px;
    font-size:26px;
}

.role{
    margin:auto;
    margin-top:12px;
    width:max-content;
    background:#13293d;
    color:#38bdf8;
    padding:8px 16px;
    border-radius:30px;
    font-size:14px;
}

.points{
    text-align:center;
    margin-top:18px;
    color:#facc15;
    font-size:26px;
    font-weight:700;
}

/* BUTTONS */

.btns{
    margin-top:25px;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.open-site{
    width:100%;
    background:#22c55e;
    color:white;
    border:none;
    padding:14px;
    border-radius:14px;
    font-size:16px;
    cursor:pointer;
    font-weight:600;
}

.open-files{
    width:100%;
    background:#2563eb;
    color:white;
    border:none;
    padding:14px;
    border-radius:14px;
    font-size:16px;
    cursor:pointer;
    font-weight:600;
}

.open-site:hover{
    background:#16a34a;
}

.open-files:hover{
    background:#1d4ed8;
}

/* MOBILE */

@media(max-width:768px){

    body{
        padding:15px;
    }

    .top h1{
        font-size:30px;
    }

}

</style>
</head>

<body>

<!-- TOP -->

<div class="top">

    <h1>Projects Page</h1>

    <div class="upload-box">

        <input type="file"
        id="projectFiles"
        multiple>

        <button class="upload-btn"
        onclick="uploadFiles()">

            Upload Files

        </button>

    </div>

</div>

<!-- PROJECTS -->

<div class="projects-grid"
id="projectsGrid">

</div>

<script>

/* SAMPLE USERS */

let users = [

{
    name:"Hariharan",
    role:"Web Developer",
    points:"55 MC",
    website:"https://example.com",
    files:[
        "index.html",
        "style.css",
        "script.js"
    ]
},

{
    name:"Akash",
    role:"Video Editor",
    points:"45 MC",
    website:"https://example.com",
    files:[
        "portfolio.html",
        "main.css"
    ]
},

{
    name:"Monesh",
    role:"Frontend Developer",
    points:"40 MC",
    website:"https://example.com",
    files:[
        "home.html",
        "app.js",
        "firebase.js"
    ]
}

];

/* LOAD USERS */

function loadProjects(){

    let html = "";

    users.forEach((user,index)=>{

        let firstLetter =
        user.name.charAt(0).toUpperCase();

        html += `

        <div class="card">

            <div class="avatar">
                ${firstLetter}
            </div>

            <h2 class="name">
                ${user.name}
            </h2>

            <div class="role">
                ${user.role}
            </div>

            <div class="points">
                ✨ ${user.points}
            </div>

            <div class="btns">

                <!-- OPEN WEBSITE -->

                <button class="open-site"
                onclick="openWebsite('${user.website}')">

                    Open Website

                </button>

                <!-- OPEN FILES -->

                <button class="open-files"
                onclick="showFiles(${index})">

                    Open Files

                </button>

            </div>

        </div>

        `;

    });

    document.getElementById(
    "projectsGrid"
    ).innerHTML = html;

}

/* OPEN WEBSITE */

function openWebsite(link){

    window.open(link,"_blank");

}

/* SHOW FILES */

function showFiles(index){

    let files =
    users[index].files;

    let fileText =
    files.join("\n");

    alert(
    "PROJECT FILES :\n\n"
    + fileText
    );

}

/* UPLOAD */

function uploadFiles(){

    let files =
    document.getElementById(
    "projectFiles"
    ).files;

    if(files.length === 0){

        alert("Select Files");

        return;

    }

    let uploaded = [];

    for(let i=0;i<files.length;i++){

        uploaded.push(files[i].name);

    }

    /* ADD NEW USER PROJECT */

    users.push({

        name:"Current User",

        role:"Project Upload",

        points:"10 MC",

        website:"https://example.com",

        files:uploaded

    });

    loadProjects();

    alert("Files Uploaded ✅");

}

/* PAGE LOAD */

loadProjects();

</script>

</body>
</html>
