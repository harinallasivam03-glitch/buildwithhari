<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Projects</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#020617;
    color:white;
    padding:25px;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.top h1{
    font-size:45px;
}

.upload-btn{
    background:linear-gradient(
    to right,
    #7c3aed,
    #2563eb
    );

    border:none;
    color:white;
    padding:15px 25px;
    border-radius:14px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

/* PROJECTS */

.projects{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}

.card{
    background:linear-gradient(
    145deg,
    #111827,
    #0b1220
    );

    border-radius:24px;
    padding:25px;
    border:1px solid
    rgba(255,255,255,0.05);
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#1e1b4b;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:38px;
    font-weight:700;
    color:#c4b5fd;
}

.card h2{
    text-align:center;
    margin-top:18px;
}

.user-id{
    text-align:center;
    color:#94a3b8;
    margin-top:10px;
}

.open-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    background:#22c55e;
    color:white;
    margin-top:22px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

/* POPUP */

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup-box{
    width:95%;
    max-width:500px;
    background:#0f172a;
    padding:25px;
    border-radius:24px;
}

.popup-box h2{
    margin-bottom:20px;
}

.input-box{
    margin-top:18px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
}

.input-box input{
    width:100%;
    height:55px;
    border:none;
    outline:none;
    border-radius:14px;
    padding:0 15px;
    background:#1e293b;
    color:white;
}

.file-box{
    margin-top:20px;
}

.save-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:14px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
    margin-top:25px;
    display:none;
    font-weight:600;
}

/* VIEW PAGE */

.viewer{
    display:none;
}

.viewer-card{
    background:#111827;
    padding:25px;
    border-radius:24px;
}

.website-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:14px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
    margin-top:25px;
    font-weight:600;
}

.files-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:14px;
    background:#facc15;
    color:black;
    font-size:17px;
    cursor:pointer;
    margin-top:18px;
    font-weight:700;
}

.files-list{
    display:none;
    margin-top:20px;
}

.file-item{
    background:#1e293b;
    padding:15px;
    border-radius:14px;
    margin-bottom:12px;
    cursor:pointer;
}

.file-item:hover{
    background:#334155;
}

.text-view{
    margin-top:20px;
    background:black;
    color:#22c55e;
    padding:20px;
    border-radius:16px;
    white-space:pre-wrap;
    overflow:auto;
    max-height:400px;
}

.back-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:20px;
}

@media(max-width:768px){

    body{
        padding:15px;
    }

    .top{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .top h1{
        font-size:34px;
    }

}

</style>
</head>
<body>

<!-- MAIN PAGE -->

<div id="mainPage">

    <div class="top">

        <h1>Projects</h1>

        <button class="upload-btn"
        onclick="openPopup()">
            Upload Files
        </button>

    </div>

    <div class="projects"
    id="projects"></div>

</div>

<!-- VIEW PAGE -->

<div class="viewer"
id="viewerPage">

    <button class="back-btn"
    onclick="goBack()">
        ← Back
    </button>

    <div class="viewer-card">

        <h1 id="viewName"></h1>

        <p id="viewId"
        style="
        margin-top:10px;
        color:#94a3b8;
        ">
        </p>

        <button class="website-btn"
        id="websiteBtn">
            Open Website
        </button>

        <button class="files-btn"
        onclick="toggleFiles()">
            Open Files
        </button>

        <div class="files-list"
        id="filesList"></div>

        <div class="text-view"
        id="textView">

Select any file to read...

        </div>

    </div>

</div>

<!-- POPUP -->

<div class="popup"
id="popup">

    <div class="popup-box">

        <h2>Upload Project</h2>

        <div class="input-box">

            <label>User Name</label>

            <input type="text"
            id="userName"
            placeholder="Enter name">

        </div>

        <div class="input-box">

            <label>Website Link</label>

            <input type="text"
            id="websiteLink"
            placeholder="https://example.com">

        </div>

        <div class="file-box">

            <label>Select Files</label>

            <br><br>

            <input type="file"
            id="files"
            multiple
            onchange="showSaveButton()">

        </div>

        <button type="button"
        class="save-btn"
        id="saveBtn">
            Save Project
        </button>

    </div>

</div>

<script>

/* LOCAL STORAGE */

let allProjects =
JSON.parse(
localStorage.getItem("projects")
) || [];

/* RENDER */

function renderProjects(){

    let html = "";

    allProjects.forEach((project,index)=>{

        let first =
        project.name.charAt(0)
        .toUpperCase();

        html += `

        <div class="card">

            <div class="avatar">
                ${first}
            </div>

            <h2>
                ${project.name}
            </h2>

            <div class="user-id">

                USER ID :
                ${project.id}

            </div>

            <button class="open-btn"
            onclick="openProject(${index})">

                Open

            </button>

        </div>

        `;

    });

    document.getElementById(
    "projects"
    ).innerHTML = html;

}

renderProjects();

/* OPEN POPUP */

function openPopup(){

    document.getElementById(
    "popup"
    ).style.display = "flex";

}

/* CLOSE POPUP */

window.onclick = function(e){

    if(e.target.id === "popup"){

        document.getElementById(
        "popup"
        ).style.display = "none";

    }

}

/* SHOW SAVE BUTTON */

function showSaveButton(){

    document.getElementById(
    "saveBtn"
    ).style.display = "block";

}

/* SAVE PROJECT */

document.getElementById(
"saveBtn"
).addEventListener(
"click",
saveProject
);

async function saveProject(){

    let name =
    document.getElementById(
    "userName"
    ).value.trim();

    let website =
    document.getElementById(
    "websiteLink"
    ).value.trim();

    let files =
    document.getElementById(
    "files"
    ).files;

    if(name === ""){

        alert("Enter User Name");
        return;

    }

    if(website === ""){

        alert("Enter Website Link");
        return;

    }

    if(files.length === 0){

        alert("Select Files");
        return;

    }

    let fileData = [];

    for(let file of files){

        let text =
        await file.text();

        fileData.push({

            fileName:file.name,
            content:text

        });

    }

    let project = {

        id:"USER" +
        Date.now(),

        name:name,

        website:website,

        files:fileData

    };

    allProjects.push(project);

    localStorage.setItem(
    "projects",
    JSON.stringify(allProjects)
    );

    renderProjects();

    document.getElementById(
    "popup"
    ).style.display = "none";

    alert("Project Saved ✅");

}

/* OPEN PROJECT */

function openProject(index){

    let project =
    allProjects[index];

    document.getElementById(
    "mainPage"
    ).style.display = "none";

    document.getElementById(
    "viewerPage"
    ).style.display = "block";

    document.getElementById(
    "viewName"
    ).innerText =
    project.name;

    document.getElementById(
    "viewId"
    ).innerText =
    "USER ID : " +
    project.id;

    document.getElementById(
    "websiteBtn"
    ).onclick = function(){

        window.open(
        project.website,
        "_blank"
        );

    }

    let html = "";

    project.files.forEach((file)=>{

        html += `

        <div class="file-item"
        onclick='openFile(
        ${JSON.stringify(file.content)}
        )'>

            ${file.fileName}

        </div>

        `;

    });

    document.getElementById(
    "filesList"
    ).innerHTML = html;

}

/* TOGGLE FILES */

function toggleFiles(){

    let box =
    document.getElementById(
    "filesList"
    );

    if(box.style.display === "block"){

        box.style.display = "none";

    }

    else{

        box.style.display = "block";

    }

}

/* OPEN FILE */

function openFile(content){

    document.getElementById(
    "textView"
    ).innerText =
    content;

}

/* BACK */

function goBack(){

    document.getElementById(
    "viewerPage"
    ).style.display = "none";

    document.getElementById(
    "mainPage"
    ).style.display = "block";

}

</script>

</body>
</html>s
